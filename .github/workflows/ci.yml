name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get

      # Generated code is committed; fail if it has drifted from the sources.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' '*.config.dart'

      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android release build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get

      # No key.properties in CI, so build.gradle.kts falls back to the debug
      # key. This proves the release pipeline (R8, shrinking, splash, icons)
      # still builds; the Play upload is always made locally with the real key.
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
